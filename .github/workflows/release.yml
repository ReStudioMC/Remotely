name: Release Remotely

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release Version
        required: true
        type: string
      channel:
        description: Release Channel
        required: true
        type: choice
        default: stable
        options: [stable, dev]
      visibility:
        description: Release Visibility
        required: true
        type: choice
        default: PUBLIC
        options: [PUBLIC, UNLISTED]
      changelog:
        description: Release Changelog
        required: false
        type: string
      publish_confirm:
        description: Type PUBLISH To Release
        required: true
        type: string
      operation:
        description: Release Operation
        required: true
        type: choice
        default: release
        options: [release, verify]
      target:
        description: Release Target
        required: true
        type: choice
        default: app
        options: [app, mod]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      visibility: ${{ steps.release.outputs.visibility }}
      changelog: ${{ steps.release.outputs.changelog }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      target: ${{ steps.release.outputs.target }}
      rescreen_ref: ${{ steps.dependencies.outputs.rescreen }}
      remodel_ref: ${{ steps.dependencies.outputs.remodel }}
      rebase_ref: ${{ steps.dependencies.outputs.rebase }}
      recast_ref: ${{ steps.dependencies.outputs.recast }}
      resync_ref: ${{ steps.dependencies.outputs.resync }}
      reproxy_ref: ${{ steps.dependencies.outputs.reproxy }}
    steps:
      - id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VISIBILITY: ${{ inputs.visibility }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          INPUT_CONFIRM: ${{ inputs.publish_confirm }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_TARGET: ${{ inputs.target }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_CONFIRM" != "PUBLISH" ]]; then
            printf 'Publish Confirmation Is Required\n' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            version=${RELEASE_TAG#remotely-}
            version=${version#v}
            channel=stable
            [[ "$RELEASE_PRERELEASE" == "true" ]] && channel=dev
            visibility=PUBLIC
            changelog=$RELEASE_BODY
            source_ref=$RELEASE_TAG
            target=app
          else
            version=$INPUT_VERSION
            channel=$INPUT_CHANNEL
            visibility=$INPUT_VISIBILITY
            changelog=$INPUT_CHANGELOG
            source_ref=$GITHUB_REF
            target=$INPUT_TARGET
          fi
          if [[ "$target" == "mod" && "$channel" != "dev" ]]; then
            printf 'RemotelyMod Public Releases Require The Dev Channel\n' >&2
            exit 1
          fi
          if [[ "$target" == "mod" && "$INPUT_OPERATION" == "verify" ]]; then
            printf 'RemotelyMod Does Not Support The App Verification Operation\n' >&2
            exit 1
          fi
          if [[ ${#version} -gt 64 || ! "$version" =~ ^[0-9]+([.][0-9A-Za-z]+|[-+_][0-9A-Za-z]+)*$ ]]; then
            printf 'Release Version Is Invalid: %s\n' "$version" >&2
            exit 1
          fi
          delimiter="RESTUDIO_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            printf 'version=%s\n' "$version"
            printf 'channel=%s\n' "$channel"
            printf 'visibility=%s\n' "$visibility"
            printf 'source_ref=%s\n' "$source_ref"
            printf 'target=%s\n' "$target"
            printf 'changelog<<%s\n%s\n%s\n' "$delimiter" "$changelog" "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - id: dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPROJECTS_PAT }}
        run: |
          resolve() {
            local repository=$1
            local output=$2
            local branch
            branch=$(gh api "repos/$repository" --jq '.default_branch')
            printf '%s=%s\n' "$output" "$(gh api "repos/$repository/commits/$branch" --jq '.sha')" >> "$GITHUB_OUTPUT"
          }
          resolve RedxAx/ReScreen rescreen
          resolve RedxAx/Remodel remodel
          resolve RedxAx/Rebase rebase
          resolve RedxAx/Recast recast
          resolve RedxAx/ReSync resync
          resolve RedxAx/ReProxy reproxy

  jar:
    needs: prepare
    if: needs.prepare.outputs.target == 'app'
    runs-on: [self-hosted, node1, linux, release]
    env:
      GRADLE_USER_HOME: /var/cache/restudio-gradle
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ReProjects/Remotely
          ref: ${{ needs.prepare.outputs.source_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReScreen
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReScreen
          ref: ${{ needs.prepare.outputs.rescreen_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/Remodel
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Remodel
          ref: ${{ needs.prepare.outputs.remodel_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/Rebase
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Rebase
          ref: ${{ needs.prepare.outputs.rebase_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/Recast
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Recast
          ref: ${{ needs.prepare.outputs.recast_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReSync
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReSync
          ref: ${{ needs.prepare.outputs.resync_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReProxy
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReProxy
          ref: ${{ needs.prepare.outputs.reproxy_ref }}
      - name: Build Remotely Jar And Linux AppImage
        working-directory: ReProjects/Remotely
        shell: bash
        run: |
          chmod +x gradlew
          flock /var/lock/restudio-release-build.lock ./gradlew "-Premotely.version=$RELEASE_VERSION" fatJar createLinuxAppImage --no-daemon --max-workers=2 --no-parallel --stacktrace
          install -d release-artifacts
          cp build/libs/Remotely-Fat.jar "release-artifacts/Remotely-$RELEASE_VERSION.jar"
          app_dir=build/app-image/Remotely
          test -x "$app_dir/lib/runtime/bin/java"
          ln -s bin/Remotely "$app_dir/AppRun"
          cp packaging/Remotely.png "$app_dir/remotely.png"
          printf '[Desktop Entry]\nType=Application\nName=Remotely\nComment=Minecraft Server IDE\nExec=Remotely\nIcon=remotely\nCategories=Development;\nTerminal=false\n' > "$app_dir/remotely.desktop"
          curl --fail --location --retry 3 --output appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          printf 'a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  appimagetool.AppImage\n' | sha256sum --check
          chmod +x appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool.AppImage "$app_dir" "release-artifacts/Remotely-$RELEASE_VERSION.AppImage"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remotely-jar
          path: ReProjects/Remotely/release-artifacts/*.jar
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remotely-linux
          path: ReProjects/Remotely/release-artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 30

  windows:
    needs: prepare
    if: needs.prepare.outputs.target == 'app'
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ReProjects/Remotely
          ref: ${{ needs.prepare.outputs.source_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReScreen
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReScreen
          ref: ${{ needs.prepare.outputs.rescreen_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/Remodel
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Remodel
          ref: ${{ needs.prepare.outputs.remodel_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/Rebase
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Rebase
          ref: ${{ needs.prepare.outputs.rebase_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/Recast
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Recast
          ref: ${{ needs.prepare.outputs.recast_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReSync
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReSync
          ref: ${{ needs.prepare.outputs.resync_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReProxy
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReProxy
          ref: ${{ needs.prepare.outputs.reproxy_ref }}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build Remotely Installer
        working-directory: ReProjects/Remotely
        shell: pwsh
        run: |
          .\gradlew.bat "-Premotely.version=$env:RELEASE_VERSION" "-Premotely.releaseInstallerBuild=true" createInstaller --no-daemon --max-workers=2 --no-parallel --stacktrace
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $installer = Get-ChildItem -LiteralPath build/dist -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Remotely Installer Was Not Created' }
          Copy-Item -LiteralPath $installer.FullName -Destination "release-artifacts/Remotely-$env:RELEASE_VERSION.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remotely-windows
          path: ReProjects/Remotely/release-artifacts/*.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: prepare
    if: needs.prepare.outputs.target == 'app'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ReProjects/Remotely
          ref: ${{ needs.prepare.outputs.source_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReScreen
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReScreen
          ref: ${{ needs.prepare.outputs.rescreen_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/Remodel
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Remodel
          ref: ${{ needs.prepare.outputs.remodel_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/Rebase
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Rebase
          ref: ${{ needs.prepare.outputs.rebase_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/Recast
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Recast
          ref: ${{ needs.prepare.outputs.recast_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReSync
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReSync
          ref: ${{ needs.prepare.outputs.resync_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReProxy
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReProxy
          ref: ${{ needs.prepare.outputs.reproxy_ref }}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build Remotely Disk Image
        working-directory: ReProjects/Remotely
        shell: bash
        run: |
          iconset=build/Remotely.iconset
          mkdir -p "$iconset" release-artifacts
          for entry in '16 icon_16x16.png' '32 icon_16x16@2x.png' '32 icon_32x32.png' '64 icon_32x32@2x.png' '128 icon_128x128.png' '256 icon_128x128@2x.png' '256 icon_256x256.png' '512 icon_256x256@2x.png' '512 icon_512x512.png' '1024 icon_512x512@2x.png'; do
            read -r size name <<< "$entry"
            sips -z "$size" "$size" packaging/Remotely.png --out "$iconset/$name" >/dev/null
          done
          iconutil --convert icns "$iconset" --output build/Remotely.icns
          chmod +x gradlew
          ./gradlew "-Premotely.version=$RELEASE_VERSION" -Premotely.packageIcon="$PWD/build/Remotely.icns" createMacDmg --no-daemon --max-workers=2 --no-parallel --stacktrace
          disk_image=$(find build/dist-macos -maxdepth 1 -type f -name '*.dmg' -print -quit)
          [[ -n "$disk_image" ]] || { printf 'Remotely Disk Image Was Not Created\n' >&2; exit 1; }
          mount_point=$(mktemp -d)
          cleanup_mount() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rmdir "$mount_point" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT
          hdiutil attach "$disk_image" -nobrowse -readonly -mountpoint "$mount_point"
          app_path=$(find "$mount_point" -maxdepth 1 -type d -name 'Remotely.app' -print -quit)
          [[ -n "$app_path" ]]
          test -x "$app_path/Contents/runtime/Contents/Home/bin/java"
          grep -Fq 'java-options=-XstartOnFirstThread' "$app_path/Contents/app/Remotely.cfg"
          cleanup_mount
          trap - EXIT
          cp "$disk_image" "release-artifacts/Remotely-$RELEASE_VERSION-${{ matrix.platform }}.dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remotely-${{ matrix.platform }}
          path: ReProjects/Remotely/release-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, jar, windows, macos]
    if: needs.prepare.outputs.target == 'app'
    runs-on: [self-hosted, node1, linux, release]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: remotely-*
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReStudio
          token: ${{ secrets.REPROJECTS_PAT }}
          path: release-tools
          ref: 78d63bab135fc1819ea3f4b0f3b48d20b2e5b122
      - name: Publish Remotely
        shell: bash
        env:
          RELEASE_CHANGELOG: ${{ needs.prepare.outputs.changelog }}
          DELETE_AFTER_PUBLISH: ${{ inputs.operation == 'verify' && 'true' || 'false' }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VISIBILITY: ${{ needs.prepare.outputs.visibility }}
        run: |
          chmod +x release-tools/scripts/releases/publish-release.sh
          project=remotely
          channel=$RELEASE_CHANNEL
          visibility=$RELEASE_VISIBILITY
          [[ "$channel" == "dev" ]] && project=remotely-dev
          if [[ "$RELEASE_OPERATION" == "verify" ]]; then
            project=remotely-dev
            channel=dev
            visibility=UNLISTED
          fi
          api=${RESTUDIO_RELEASE_API:-https://restudiomc.net/api/releases}
          audience=${RESTUDIO_RELEASE_AUDIENCE:-https://restudiomc.net/api/releases}
          published_ids=()
          oidc_token() {
            local audience_encoded
            audience_encoded=$(jq -rn --arg value "$audience" '$value | @uri')
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience_encoded}" | jq -er '.value'
          }
          rollback_releases() {
            local status=$?
            trap - EXIT
            if [[ "$status" != "0" && ${#published_ids[@]} -gt 0 ]]; then
              set +e
              printf 'Rolling Back %s Published Release Artifacts\n' "${#published_ids[@]}" >&2
              for ((index=${#published_ids[@]} - 1; index >= 0; index--)); do
                token=$(oidc_token)
                delete_status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
                  --connect-timeout 30 --max-time 120 --request DELETE \
                  --header "Authorization: Bearer $token" \
                  "$api/${published_ids[$index]}")
                if [[ "$delete_status" != "204" ]]; then
                  printf 'Release Rollback Failed For %s With HTTP %s\n' "${published_ids[$index]}" "$delete_status" >&2
                fi
              done
            fi
            exit "$status"
          }
          publish_release() {
            local file=$1
            local platform=$2
            local checksum existing response release_id
            checksum=$(sha256sum "$file" | awk '{print tolower($1)}')
            existing=$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors "$api/$project" | jq -r \
              --arg version "$RELEASE_VERSION" --arg channel "$channel" --arg platform "$platform" --arg checksum "$checksum" \
              '[.[] | select(.version == $version and .channel == $channel and .platform == $platform and (.checksum | ascii_downcase) == $checksum)] | first | .id // empty')
            response=$(release-tools/scripts/releases/publish-release.sh "$file" "$project" "$RELEASE_VERSION" "$channel" "$platform" "$visibility")
            printf '%s\n' "$response" | jq .
            release_id=$(jq -er '.id' <<< "$response")
            if [[ "$DELETE_AFTER_PUBLISH" != "true" && -z "$existing" ]]; then
              published_ids+=("$release_id")
            fi
          }
          artifacts=(
            "artifacts/Remotely-$RELEASE_VERSION.jar"
            "artifacts/Remotely-$RELEASE_VERSION.exe"
            "artifacts/Remotely-$RELEASE_VERSION.AppImage"
            "artifacts/Remotely-$RELEASE_VERSION-macos-arm64.dmg"
            "artifacts/Remotely-$RELEASE_VERSION-macos-x64.dmg"
          )
          for artifact in "${artifacts[@]}"; do
            [[ -s "$artifact" ]] || { printf 'Release Artifact Is Missing Or Empty: %s\n' "$artifact" >&2; exit 1; }
          done
          trap rollback_releases EXIT
          publish_release "${artifacts[0]}" crossplatform
          publish_release "${artifacts[1]}" windows
          publish_release "${artifacts[2]}" linux
          publish_release "${artifacts[3]}" macos-arm64
          publish_release "${artifacts[4]}" macos-x64
          trap - EXIT

  publish-mod:
    needs: prepare
    if: needs.prepare.outputs.target == 'mod'
    runs-on: [self-hosted, node1, linux, release]
    timeout-minutes: 480
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GRADLE_USER_HOME: /var/cache/restudio-gradle
      ORG_GRADLE_PROJECT_org.gradle.jvmargs: -Xmx8g -Dfile.encoding=UTF-8
      ORG_GRADLE_PROJECT_org.gradle.workers.max: '2'
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_CHANGELOG: ${{ needs.prepare.outputs.changelog }}
      RELEASE_VISIBILITY: ${{ needs.prepare.outputs.visibility }}
    steps:
      - name: Checkout Remotely
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ReProjects/Remotely
          ref: ${{ needs.prepare.outputs.source_ref }}
      - name: Checkout ReScreen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReScreen
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReScreen
          ref: ${{ needs.prepare.outputs.rescreen_ref }}
      - name: Checkout Remodel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/Remodel
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Remodel
          ref: ${{ needs.prepare.outputs.remodel_ref }}
      - name: Checkout Rebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/Rebase
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Rebase
          ref: ${{ needs.prepare.outputs.rebase_ref }}
      - name: Checkout Recast
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/Recast
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Recast
          ref: ${{ needs.prepare.outputs.recast_ref }}
      - name: Checkout ReSync
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReSync
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReSync
          ref: ${{ needs.prepare.outputs.resync_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReProxy
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReProxy
          ref: ${{ needs.prepare.outputs.reproxy_ref }}
      - name: Set Up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare RemotelyMod Sources
        working-directory: ReProjects
        shell: bash
        run: |
          chmod +x Remotely/RemotelyMod/scripts/ci-ensure-remodel-java21.sh
          Remotely/RemotelyMod/scripts/ci-ensure-remodel-java21.sh Remodel
          chmod +x Remotely/RemotelyMod/scripts/ensure-version-project-dirs.sh
          Remotely/RemotelyMod/scripts/ensure-version-project-dirs.sh
      - name: Build Every RemotelyMod Version
        working-directory: ReProjects/Remotely
        shell: bash
        run: |
          chmod +x gradlew RemotelyMod/gradlew
          flock /var/lock/restudio-release-build.lock ./gradlew jar --no-daemon --max-workers=2 --no-parallel --stacktrace
          cd RemotelyMod
          flock /var/lock/restudio-release-build.lock ./gradlew "-Premotely.version=$RELEASE_VERSION" buildAllVersions --no-daemon --max-workers=2 --no-parallel --stacktrace
          mapfile -t jars < <(find build/versions -maxdepth 1 -type f -name "Remotely-$RELEASE_VERSION+*.jar" -print | sort)
          [[ ${#jars[@]} -gt 0 ]] || { printf 'No RemotelyMod Jars Were Produced\n' >&2; exit 1; }
      - name: Retain RemotelyMod Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remotelymod-${{ needs.prepare.outputs.version }}
          path: ReProjects/Remotely/RemotelyMod/build/versions/*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Checkout Release Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: RedxAx/ReStudio
          token: ${{ secrets.REPROJECTS_PAT }}
          path: release-tools
          ref: 78d63bab135fc1819ea3f4b0f3b48d20b2e5b122
      - name: Publish Every RemotelyMod Version To ReStudio
        shell: bash
        run: |
          chmod +x release-tools/scripts/releases/publish-release.sh
          api=${RESTUDIO_RELEASE_API:-https://restudiomc.net/api/releases}
          audience=${RESTUDIO_RELEASE_AUDIENCE:-https://restudiomc.net/api/releases}
          project=remotely-dev
          channel=dev
          published_ids=()
          oidc_token() {
            local audience_encoded
            audience_encoded=$(jq -rn --arg value "$audience" '$value | @uri')
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience_encoded}" | jq -er '.value'
          }
          rollback_releases() {
            local status=$?
            trap - EXIT
            if [[ "$status" != "0" && ${#published_ids[@]} -gt 0 ]]; then
              set +e
              printf 'Rolling Back %s Published RemotelyMod Artifacts\n' "${#published_ids[@]}" >&2
              for ((index=${#published_ids[@]} - 1; index >= 0; index--)); do
                token=$(oidc_token)
                curl --silent --show-error --location --output /dev/null --request DELETE \
                  --header "Authorization: Bearer $token" "$api/${published_ids[$index]}"
              done
            fi
            exit "$status"
          }
          publish_release() {
            local file=$1
            local name variant loader minecraft platform checksum existing response release_id
            name=$(basename "$file")
            variant=${name#"Remotely-$RELEASE_VERSION+"}
            variant=${variant%.jar}
            loader=${variant##*-}
            minecraft=${variant%-*}
            platform="$loader-$minecraft"
            checksum=$(sha256sum "$file" | awk '{print tolower($1)}')
            existing=$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors "$api/$project" | jq -r \
              --arg version "$RELEASE_VERSION" --arg channel "$channel" --arg platform "$platform" --arg checksum "$checksum" \
              '[.[] | select(.version == $version and .channel == $channel and .platform == $platform and (.checksum | ascii_downcase) == $checksum)] | first | .id // empty')
            response=$(release-tools/scripts/releases/publish-release.sh "$file" "$project" "$RELEASE_VERSION" "$channel" "$platform" "$RELEASE_VISIBILITY")
            printf '%s\n' "$response" | jq .
            release_id=$(jq -er '.id' <<< "$response")
            if [[ -z "$existing" ]]; then
              published_ids+=("$release_id")
            fi
          }
          mapfile -t artifacts < <(find ReProjects/Remotely/RemotelyMod/build/versions -maxdepth 1 -type f -name "Remotely-$RELEASE_VERSION+*.jar" -print | sort)
          [[ ${#artifacts[@]} -gt 0 ]] || { printf 'No RemotelyMod Artifacts Were Found\n' >&2; exit 1; }
          trap rollback_releases EXIT
          for artifact in "${artifacts[@]}"; do
            publish_release "$artifact"
          done
          trap - EXIT

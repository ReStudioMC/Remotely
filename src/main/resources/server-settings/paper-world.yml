providerId: remotely-paper-world
priority: 4
packs:
  - id: paper-world
    name: Paper World
    description: Paper settings that control each world's gameplay, spawning, entities, environment, and performance.
    priority: 4
    software: [paper, folia, purpur, leaf]
    documents:
      - path: config/paper-world-defaults.yml
        format: yaml
        createIfMissing: true
        fields:
          - id: anticheat-anti-xray-enabled
            key: anticheat.anti-xray.enabled
            type: boolean
            tab: Software Settings
            group: Anti-Xray
            name: Anti-Xray
            description: Enables Paper's Anti-Xray protection.
            default: false
          - id: anticheat-anti-xray-engine-mode
            key: anticheat.anti-xray.engine-mode
            type: select
            tab: Software Settings
            group: Anti-Xray
            name: Engine Mode
            description: Chooses how Paper hides blocks from clients.
            default: '1'
            options: ['1', '2', '3']
          - id: anticheat-anti-xray-hidden-blocks
            key: anticheat.anti-xray.hidden-blocks
            type: list
            tab: Software Settings
            group: Anti-Xray
            name: Hidden Blocks
            description: Chooses the blocks that Anti-Xray hides or replaces.
            default: [copper_ore, deepslate_copper_ore, raw_copper_block, gold_ore, deepslate_gold_ore, iron_ore, deepslate_iron_ore, raw_iron_block, coal_ore, deepslate_coal_ore, lapis_ore, deepslate_lapis_ore, mossy_cobblestone, obsidian, chest, diamond_ore, deepslate_diamond_ore, redstone_ore, deepslate_redstone_ore, clay, emerald_ore, deepslate_emerald_ore, ender_chest]
            collection:
              mode: sequence
              ordered: true
              unique: true
              value:
                type: text
                catalog: {source: 'server:minecraft:block'}
                allowCustom: true
          - id: anticheat-anti-xray-lava-obscures
            key: anticheat.anti-xray.lava-obscures
            type: boolean
            tab: Software Settings
            group: Anti-Xray
            name: Obscure Lava Blocks
            description: Obfuscates blocks touching lava.
            default: false
          - id: anticheat-anti-xray-max-block-height
            key: anticheat.anti-xray.max-block-height
            type: integer
            tab: Software Settings
            group: Anti-Xray
            name: Maximum Block Height
            description: Sets the highest Y level where Anti-Xray operates.
            default: 64
          - id: anticheat-anti-xray-replacement-blocks
            key: anticheat.anti-xray.replacement-blocks
            type: list
            tab: Software Settings
            group: Anti-Xray
            name: Replacement Blocks
            description: Chooses the blocks Anti-Xray may show in place of hidden blocks.
            default: [stone, oak_planks, deepslate]
            collection:
              mode: sequence
              ordered: true
              unique: true
              value:
                type: text
                catalog: {source: 'server:minecraft:block'}
                allowCustom: true
          - id: anticheat-anti-xray-update-radius
            key: anticheat.anti-xray.update-radius
            type: integer
            tab: Software Settings
            group: Anti-Xray
            name: Update Radius
            description: Sets how many blocks around an interaction receive real block data.
            default: 2
            min: 0
            max: 2
          - id: anticheat-anti-xray-use-permission
            key: anticheat.anti-xray.use-permission
            type: boolean
            tab: Software Settings
            group: Anti-Xray
            name: Bypass Permission
            description: Allows paper.antixray.bypass to bypass Anti-Xray.
            default: false
          - id: chunks-auto-save-interval
            key: chunks.auto-save-interval
            type: integer-or-default
            tab: Software Settings
            group: Chunks
            name: Auto-Save Interval
            description: Sets this world's chunk save interval in ticks.
            default: default
          - id: chunks-delay-chunk-unloads-by
            key: chunks.delay-chunk-unloads-by
            type: duration
            tab: Software Settings
            group: Chunks
            name: Chunk Unload Delay
            description: Delays unloading chunks after they are no longer needed.
            default: 10s
          - id: chunks-fixed-chunk-inhabited-time
            key: chunks.fixed-chunk-inhabited-time
            type: integer
            tab: Software Settings
            group: Chunks
            name: Fixed Inhabited Time
            description: Fixes the inhabited time stored for chunks when set to zero or higher.
            default: -1
          - id: chunks-flush-regions-on-save
            key: chunks.flush-regions-on-save
            type: boolean
            tab: Software Settings
            group: Chunks
            name: Flush Regions On Save
            description: Flushes chunk regions to disk whenever chunks are saved.
            default: false
          - id: chunks-max-auto-save-chunks-per-tick
            key: chunks.max-auto-save-chunks-per-tick
            type: integer
            tab: Software Settings
            group: Chunks
            name: Auto-Save Chunks Per Tick
            description: Limits how many chunks the auto-save system saves per tick.
            default: 24
          - id: chunks-prevent-moving-into-unloaded-chunks
            key: chunks.prevent-moving-into-unloaded-chunks
            type: boolean
            tab: Software Settings
            group: Chunks
            name: Prevent Unloaded Chunk Movement
            description: Prevents players from moving into unloaded chunks.
            default: false
          - id: collisions-allow-player-cramming-damage
            key: collisions.allow-player-cramming-damage
            type: boolean
            tab: Software Settings
            group: Collisions
            name: Player Cramming Damage
            description: Allows players to take damage from entity cramming.
            default: false
          - id: collisions-allow-vehicle-collisions
            key: collisions.allow-vehicle-collisions
            type: boolean
            tab: Software Settings
            group: Collisions
            name: Vehicle Collisions
            description: Allows vehicles to collide when only players are set to collide.
            default: true
          - id: collisions-fix-climbing-bypassing-cramming-rule
            key: collisions.fix-climbing-bypassing-cramming-rule
            type: boolean
            tab: Software Settings
            group: Collisions
            name: Count Climbing Entities
            description: Counts climbing entities toward the cramming limit.
            default: false
          - id: collisions-max-entity-collisions
            key: collisions.max-entity-collisions
            type: integer
            tab: Software Settings
            group: Collisions
            name: Maximum Entity Collisions
            description: Stops processing collisions after this many entities.
            default: 8
          - id: collisions-only-players-collide
            key: collisions.only-players-collide
            type: boolean
            tab: Software Settings
            group: Collisions
            name: Player-Only Collisions
            description: Calculates collisions only when a player is involved.
            default: false
          - id: command-blocks-force-follow-perm-level
            key: command-blocks.force-follow-perm-level
            type: boolean
            tab: Software Settings
            group: Command Blocks
            name: Require Command Permission Level
            description: Requires command blocks to pass both Bukkit and Vanilla permission checks.
            default: true
          - id: command-blocks-permissions-level
            key: command-blocks.permissions-level
            type: integer
            tab: Software Settings
            group: Command Blocks
            name: Command Block Permission Level
            description: Sets the default Vanilla permission level for command blocks.
            default: 2
          - id: entities-armor-stands-do-collision-entity-lookups
            key: entities.armor-stands.do-collision-entity-lookups
            type: boolean
            tab: Software Settings
            group: Entities
            name: Armor Stand Collision Lookups
            description: Lets armor stands perform entity collision checks.
            default: true
          - id: entities-armor-stands-tick
            key: entities.armor-stands.tick
            type: boolean
            tab: Software Settings
            group: Entities
            name: Tick Armor Stands
            description: Ticks armor stands in loaded chunks.
            default: true
          - id: entities-behavior-allow-spider-world-border-climbing
            key: entities.behavior.allow-spider-world-border-climbing
            type: boolean
            tab: Software Settings
            group: Entities
            name: Spider Border Climbing
            description: Lets spiders climb the world border like a wall.
            default: true
          - id: entities-behavior-baby-zombie-movement-modifier
            key: entities.behavior.baby-zombie-movement-modifier
            type: decimal
            tab: Software Settings
            group: Entities
            name: Baby Zombie Movement Modifier
            description: Changes baby zombie movement speed.
            default: 0.5
          - id: entities-behavior-cooldown-failed-beehive-releases
            key: entities.behavior.cooldown-failed-beehive-releases
            type: boolean
            tab: Software Settings
            group: Entities
            name: Failed Beehive Release Cooldown
            description: Adds a cooldown after bees fail to leave a hive.
            default: true
          - id: entities-behavior-disable-chest-cat-detection
            key: entities.behavior.disable-chest-cat-detection
            type: boolean
            tab: Software Settings
            group: Entities
            name: Ignore Cats On Chests
            description: Allows opening chests with cats sitting on top.
            default: false
          - id: entities-behavior-disable-creeper-lingering-effect
            key: entities.behavior.disable-creeper-lingering-effect
            type: boolean
            tab: Software Settings
            group: Entities
            name: Disable Creeper Lingering Effect
            description: Prevents creepers from leaving lingering effect clouds.
            default: false
          - id: entities-behavior-disable-player-crits
            key: entities.behavior.disable-player-crits
            type: boolean
            tab: Software Settings
            group: Entities
            name: Disable Player Critical Hits
            description: Treats player critical hits as normal hits.
            default: false
          - id: entities-behavior-ender-dragons-death-always-places-dragon-egg
            key: entities.behavior.ender-dragons-death-always-places-dragon-egg
            type: boolean
            tab: Software Settings
            group: Entities
            name: Always Place Dragon Egg
            description: Places a dragon egg whenever an Ender Dragon dies.
            default: false
          - id: entities-behavior-experience-merge-max-value
            key: entities.behavior.experience-merge-max-value
            type: integer
            tab: Software Settings
            group: Entities
            name: Experience Merge Maximum
            description: Sets the maximum value of a merged experience orb; -1 keeps no maximum.
            default: -1
          - id: entities-behavior-mobs-can-always-pick-up-loot-zombies
            key: entities.behavior.mobs-can-always-pick-up-loot.zombies
            type: boolean
            tab: Software Settings
            group: Entities
            name: Zombies Always Pick Up Loot
            description: Lets zombies always pick up dropped loot.
            default: false
          - id: entities-behavior-mobs-can-always-pick-up-loot-skeletons
            key: entities.behavior.mobs-can-always-pick-up-loot.skeletons
            type: boolean
            tab: Software Settings
            group: Entities
            name: Skeletons Always Pick Up Loot
            description: Lets skeletons always pick up dropped loot.
            default: false
          - id: entities-behavior-nerf-pigmen-from-nether-portals
            key: entities.behavior.nerf-pigmen-from-nether-portals
            type: boolean
            tab: Software Settings
            group: Entities
            name: Nerf Portal Piglins
            description: Removes AI from piglins spawned by Nether portals.
            default: false
          - id: entities-behavior-only-merge-items-horizontally
            key: entities.behavior.only-merge-items-horizontally
            type: boolean
            tab: Software Settings
            group: Entities
            name: Merge Items Horizontally
            description: Merges items only when they are on the same Y level.
            default: false
          - id: entities-behavior-parrots-are-unaffected-by-player-movement
            key: entities.behavior.parrots-are-unaffected-by-player-movement
            type: boolean
            tab: Software Settings
            group: Entities
            name: Keep Shoulder Parrots Attached
            description: Keeps shoulder parrots attached while players move.
            default: false
          - id: entities-behavior-phantoms-do-not-spawn-on-creative-players
            key: entities.behavior.phantoms-do-not-spawn-on-creative-players
            type: boolean
            tab: Software Settings
            group: Entities
            name: No Phantoms On Creative Players
            description: Prevents phantoms from spawning on creative players.
            default: true
          - id: entities-behavior-phantoms-only-attack-insomniacs
            key: entities.behavior.phantoms-only-attack-insomniacs
            type: boolean
            tab: Software Settings
            group: Entities
            name: Phantoms Attack Insomniacs Only
            description: Prevents phantoms from attacking players who have slept.
            default: true
          - id: entities-behavior-phantoms-spawn-attempt-max-seconds
            key: entities.behavior.phantoms-spawn-attempt-max-seconds
            type: integer
            tab: Software Settings
            group: Entities
            name: Maximum Phantom Attempt Delay
            description: Sets the maximum seconds between phantom spawn attempts.
            default: 119
          - id: entities-behavior-phantoms-spawn-attempt-min-seconds
            key: entities.behavior.phantoms-spawn-attempt-min-seconds
            type: integer
            tab: Software Settings
            group: Entities
            name: Minimum Phantom Attempt Delay
            description: Sets the minimum seconds between phantom spawn attempts.
            default: 60
          - id: entities-behavior-piglins-guard-chests
            key: entities.behavior.piglins-guard-chests
            type: boolean
            tab: Software Settings
            group: Entities
            name: Piglins Guard Chests
            description: Lets angered piglins guard nearby chests.
            default: true
          - id: entities-behavior-pillager-patrols-disable
            key: entities.behavior.pillager-patrols.disable
            type: boolean
            tab: Software Settings
            group: Entities
            name: Disable Pillager Patrols
            description: Disables pillager patrols and their related AI.
            default: false
          - id: entities-behavior-pillager-patrols-spawn-chance
            key: entities.behavior.pillager-patrols.spawn-chance
            type: decimal
            tab: Software Settings
            group: Entities
            name: Pillager Patrol Spawn Chance
            description: Changes the chance for pillager patrols to spawn.
            default: 0.2
          - id: entities-behavior-pillager-patrols-spawn-delay-per-player
            key: entities.behavior.pillager-patrols.spawn-delay.per-player
            type: boolean
            tab: Software Settings
            group: Entities
            name: Per-Player Patrol Delay
            description: Uses an independent patrol delay for each player.
            default: false
          - id: entities-behavior-pillager-patrols-spawn-delay-ticks
            key: entities.behavior.pillager-patrols.spawn-delay.ticks
            type: integer
            tab: Software Settings
            group: Entities
            name: Patrol Spawn Delay
            description: Sets the delay in ticks between patrol spawn chances.
            default: 12000
          - id: entities-behavior-pillager-patrols-start-per-player
            key: entities.behavior.pillager-patrols.start.per-player
            type: boolean
            tab: Software Settings
            group: Entities
            name: Per-Player Patrol Start
            description: Uses an independent patrol start for each player.
            default: false
          - id: entities-behavior-pillager-patrols-start-day
            key: entities.behavior.pillager-patrols.start.day
            type: integer
            tab: Software Settings
            group: Entities
            name: Patrol Start Day
            description: Sets how many days pass between patrol starts.
            default: 5
          - id: entities-behavior-player-insomnia-start-ticks
            key: entities.behavior.player-insomnia-start-ticks
            type: integer
            tab: Software Settings
            group: Entities
            name: Phantom Insomnia Delay
            description: Sets how long a player must stay awake before phantoms can spawn; -1 disables them.
            default: 72000
          - id: entities-behavior-should-remove-dragon
            key: entities.behavior.should-remove-dragon
            type: boolean
            tab: Software Settings
            group: Entities
            name: Remove Portal-Less Dragon
            description: Removes an Ender Dragon that exists without an exit portal.
            default: false
          - id: entities-behavior-spawner-nerfed-mobs-should-jump
            key: entities.behavior.spawner-nerfed-mobs-should-jump
            type: boolean
            tab: Software Settings
            group: Entities
            name: Let Nerfed Mobs Jump
            description: Lets nerfed spawner mobs jump or float in water.
            default: false
          - id: entities-behavior-stuck-entity-poi-retry-delay
            key: entities.behavior.stuck-entity-poi-retry-delay
            type: integer-or-disabled
            tab: Software Settings
            group: Entities
            name: Stuck Entity POI Retry Delay
            description: Sets the retry delay in ticks when entity navigation cannot acquire a point of interest.
            default: 200
          - id: entities-behavior-zombie-villager-infection-chance
            key: entities.behavior.zombie-villager-infection-chance
            type: decimal-or-default
            tab: Software Settings
            group: Entities
            name: Zombie Villager Infection Chance
            description: Sets the chance that a zombie kills or converts a villager.
            default: default
            min: 0
            max: 100
          - id: entities-behavior-zombies-target-turtle-eggs
            key: entities.behavior.zombies-target-turtle-eggs
            type: boolean
            tab: Software Settings
            group: Entities
            name: Zombies Target Turtle Eggs
            description: Lets zombies and zombified piglins target turtle eggs.
            default: true
          - id: entities-markers-tick
            key: entities.markers.tick
            type: boolean
            tab: Software Settings
            group: Entities
            name: Tick Markers
            description: Ticks marker entities in loaded chunks.
            default: true
          - id: entities-mob-effects-spiders-immune-to-poison-effect
            key: entities.mob-effects.spiders-immune-to-poison-effect
            type: boolean
            tab: Software Settings
            group: Entities
            name: Spider Poison Immunity
            description: Makes spiders immune to poison.
            default: true
          - id: entities-mob-effects-immune-to-wither-effect-wither
            key: entities.mob-effects.immune-to-wither-effect.wither
            type: boolean
            tab: Software Settings
            group: Entities
            name: Wither Effect Immunity
            description: Makes Withers immune to the Wither effect.
            default: true
          - id: entities-mob-effects-immune-to-wither-effect-wither-skeleton
            key: entities.mob-effects.immune-to-wither-effect.wither-skeleton
            type: boolean
            tab: Software Settings
            group: Entities
            name: Wither Skeleton Effect Immunity
            description: Makes Wither skeletons immune to the Wither effect.
            default: true
          - id: entities-sniffer-boosted-hatch-time
            key: entities.sniffer.boosted-hatch-time
            type: integer-or-default
            tab: Software Settings
            group: Entities
            name: Boosted Sniffer Hatch Time
            description: Sets the boosted sniffer egg hatch time in ticks.
            default: default
          - id: entities-sniffer-hatch-time
            key: entities.sniffer.hatch-time
            type: integer-or-default
            tab: Software Settings
            group: Entities
            name: Sniffer Hatch Time
            description: Sets the normal sniffer egg hatch time in ticks.
            default: default
          - id: entities-spawning-all-chunks-are-slime-chunks
            key: entities.spawning.all-chunks-are-slime-chunks
            type: boolean
            tab: Software Settings
            group: Spawning
            name: All Chunks Are Slime Chunks
            description: Treats every chunk as a slime chunk for natural spawning.
            default: false
          - id: entities-spawning-alt-item-despawn-rate-enabled
            key: entities.spawning.alt-item-despawn-rate.enabled
            type: boolean
            tab: Software Settings
            group: Spawning
            name: Alternate Item Despawn Rates
            description: Enables custom despawn rates for individual items.
            default: false
          - id: entities-spawning-count-all-mobs-for-spawning
            key: entities.spawning.count-all-mobs-for-spawning
            type: boolean
            tab: Software Settings
            group: Spawning
            name: Count All Mobs For Spawning
            description: Counts spawner and miscellaneous mobs toward the global mob limit.
            default: false
          - id: entities-spawning-creative-arrow-despawn-rate
            key: entities.spawning.creative-arrow-despawn-rate
            type: integer-or-default
            tab: Software Settings
            group: Spawning
            name: Creative Arrow Despawn Rate
            description: Sets how many ticks arrows shot by creative players last.
            default: default
          - id: entities-spawning-despawn-range-shape
            key: entities.spawning.despawn-range-shape
            type: select
            tab: Software Settings
            group: Spawning
            name: Despawn Range Shape
            description: Chooses the geometry used for entity despawn ranges.
            default: ELLIPSOID
            options: [ELLIPSOID, CYLINDER]
          - id: entities-spawning-disable-mob-spawner-spawn-egg-transformation
            key: entities.spawning.disable-mob-spawner-spawn-egg-transformation
            type: boolean
            tab: Software Settings
            group: Spawning
            name: Disable Spawner Egg Transformation
            description: Prevents spawn eggs from changing a mob spawner's type.
            default: false
          - id: entities-spawning-duplicate-uuid-mode
            key: entities.spawning.duplicate-uuid.mode
            type: select
            tab: Software Settings
            group: Spawning
            name: Duplicate UUID Mode
            description: Chooses how Paper handles entities with duplicate UUIDs.
            default: SAFE_REGEN
            options: [SAFE_REGEN, DELETE, NOTHING, WARN]
          - id: entities-spawning-duplicate-uuid-safe-regen-delete-range
            key: entities.spawning.duplicate-uuid.safe-regen-delete-range
            type: integer
            tab: Software Settings
            group: Spawning
            name: Duplicate UUID Delete Range
            description: Sets how close duplicate entities must be for safe regeneration to delete extras.
            default: 32
          - id: entities-spawning-filter-bad-tile-entity-nbt-from-falling-blocks
            key: entities.spawning.filter-bad-tile-entity-nbt-from-falling-blocks
            type: boolean
            tab: Software Settings
            group: Spawning
            name: Filter Falling Block NBT
            description: Removes unsafe tile-entity data from falling blocks.
            default: true
          - id: entities-spawning-filtered-entity-tag-nbt-paths
            key: entities.spawning.filtered-entity-tag-nbt-paths
            type: list
            tab: Software Settings
            group: Spawning
            name: Filtered Entity NBT Paths
            description: Removes the selected NBT paths from entities created from item data.
            default: [Pos, Motion, sleeping_pos]
            collection:
              mode: sequence
              ordered: true
              unique: true
              value: {type: text}
          - id: entities-spawning-iron-golems-can-spawn-in-air
            key: entities.spawning.iron-golems-can-spawn-in-air
            type: boolean
            tab: Software Settings
            group: Spawning
            name: Iron Golems Spawn In Air
            description: Allows iron golems to spawn without a solid block beneath them.
            default: false
          - id: entities-spawning-max-arrow-despawn-invulnerability
            key: entities.spawning.max-arrow-despawn-invulnerability
            type: integer-or-disabled
            tab: Software Settings
            group: Spawning
            name: Arrow Despawn Invulnerability
            description: Sets the delay in ticks before arrows advance their despawn timer.
            default: 200
          - id: entities-spawning-monster-spawn-max-light-level
            key: entities.spawning.monster-spawn-max-light-level
            type: integer-or-default
            tab: Software Settings
            group: Spawning
            name: Monster Spawn Light Level
            description: Sets the highest light level where monsters can naturally spawn.
            default: default
            min: 0
          - id: entities-spawning-non-player-arrow-despawn-rate
            key: entities.spawning.non-player-arrow-despawn-rate
            type: integer-or-default
            tab: Software Settings
            group: Spawning
            name: Non-Player Arrow Despawn Rate
            description: Sets how many ticks arrows shot by non-players last.
            default: default
          - id: entities-spawning-per-player-mob-spawns
            key: entities.spawning.per-player-mob-spawns
            type: boolean
            tab: Software Settings
            group: Spawning
            name: Per-Player Mob Spawns
            description: Counts mob limits separately for each player.
            default: true
          - id: entities-spawning-scan-for-legacy-ender-dragon
            key: entities.spawning.scan-for-legacy-ender-dragon
            type: boolean
            tab: Software Settings
            group: Spawning
            name: Scan For Legacy Ender Dragon
            description: Checks for and starts legacy Ender Dragon fights.
            default: true
          - id: entities-spawning-skeleton-horse-thunder-spawn-chance
            key: entities.spawning.skeleton-horse-thunder-spawn-chance
            type: decimal-or-default
            tab: Software Settings
            group: Spawning
            name: Skeleton Horse Thunder Chance
            description: Sets the chance for a skeleton trap during thunderstorms.
            default: default
            min: 0
            max: 1
          - id: entities-spawning-slime-spawn-height-slime-chunk-maximum
            key: entities.spawning.slime-spawn-height.slime-chunk.maximum
            type: decimal
            tab: Software Settings
            group: Spawning
            name: Slime Chunk Maximum Height
            description: Sets the maximum Y level for natural slime spawning in slime chunks.
            default: 40
          - id: entities-spawning-slime-spawn-height-surface-biome-minimum
            key: entities.spawning.slime-spawn-height.surface-biome.minimum
            type: decimal
            tab: Software Settings
            group: Spawning
            name: Surface Biome Minimum Slime Height
            description: Sets the minimum Y level for natural slime spawning in surface biomes.
            default: 50
          - id: entities-spawning-slime-spawn-height-surface-biome-maximum
            key: entities.spawning.slime-spawn-height.surface-biome.maximum
            type: decimal
            tab: Software Settings
            group: Spawning
            name: Surface Biome Maximum Slime Height
            description: Sets the maximum Y level for natural slime spawning in surface biomes.
            default: 70
          - id: entities-spawning-wandering-trader-spawn-chance-failure-increment
            key: entities.spawning.wandering-trader.spawn-chance-failure-increment
            type: integer
            tab: Software Settings
            group: Spawning
            name: Trader Failure Chance Increase
            description: Increases wandering trader spawn chance by this amount after a failed attempt.
            default: 25
          - id: entities-spawning-wandering-trader-spawn-chance-max
            key: entities.spawning.wandering-trader.spawn-chance-max
            type: integer
            tab: Software Settings
            group: Spawning

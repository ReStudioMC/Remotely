            type: boolean
            tab: Software Settings
            group: Commands
            name: Silent Command Block Console
            description: Hides vanilla command feedback from the server console.
            default: false
  - id: spigot-paper
    name: Paper Spigot Extensions
    description: Configure Paper-derived extensions stored in spigot.yml.
    priority: 90
    software: [paper, folia, purpur, leaf]
    documents:
      - path: spigot.yml
        format: yaml
        createIfMissing: true
        fields:
          - id: world-settings.default.entity-activation-range.water
            key: world-settings.default.entity-activation-range.water
            type: integer
            tab: Software Settings
            group: Entity Activation
            name: Water Mob Activation Range
            description: Sets the block range where water mobs tick normally; zero or less disables throttling.
            default: 16
            min: -1
          - id: world-settings.default.entity-activation-range.villagers

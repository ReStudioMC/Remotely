providerId: remotely-spigot
priority: 100
packs:
  - id: spigot
    name: Spigot Configuration
    description: Configure shared Spigot server behavior.
    priority: 100
    software: [spigot, paper, folia, purpur, leaf]
    documents:
      - path: spigot.yml
        format: yaml
        createIfMissing: true
        fields:
          - id: settings.debug
            key: settings.debug
            type: boolean
            tab: Software Settings
            group: Server Behavior
            name: Debug Logging
            description: Enables detailed server logging.
            default: false
          - id: settings.save-user-cache-on-stop-only
            key: settings.save-user-cache-on-stop-only
            type: boolean
            tab: Software Settings
            group: Player Cache
            name: Save Cache On Stop
            description: Saves the user cache only when the server stops instead of after each update.
            default: false
          - id: settings.sample-count
            key: settings.sample-count
            type: integer
            tab: Software Settings
            group: Server List
            name: Sample Player Count
            description: Sets how many player names appear in the server-list hover sample.
            default: 12
            min: 0
            max: 12
          - id: settings.timeout-time
            key: settings.timeout-time
            type: integer
            tab: Software Settings
            group: Watchdog
            name: Watchdog Timeout
            description: Sets how many seconds without a server tick trigger the watchdog.
            default: 60
            min: 1
          - id: settings.restart-on-crash
            key: settings.restart-on-crash
            type: boolean
            tab: Software Settings
            group: Watchdog
            name: Restart On Crash
            description: Runs the restart script when the watchdog stops the server.
            default: true
          - id: settings.restart-script
            key: settings.restart-script
            type: text
            tab: Software Settings
            group: Watchdog
            name: Restart Script
            description: Sets the script used to start the server again.
            default: './start.sh'
          - id: settings.log-villager-deaths
            key: settings.log-villager-deaths
            type: boolean
            tab: Software Settings
            group: Logging
            name: Log Villager Deaths
            description: Logs villager deaths and witch transformations.
            default: true
          - id: settings.log-named-deaths
            key: settings.log-named-deaths
            type: boolean
            tab: Software Settings
            group: Logging
            name: Log Named Entity Deaths
            description: Logs deaths of entities with custom names.
            default: true
          - id: settings.bungeecord
            key: settings.bungeecord
            type: boolean
            tab: Software Settings
            group: Proxy Support
            name: BungeeCord Support
            description: Accepts forwarded player data and source addresses from BungeeCord.
            default: false
          - id: settings.filter-creative-items
            key: settings.filter-creative-items
            type: boolean
            tab: Software Settings
            group: Creative Mode
            name: Filter Creative Items
            description: Applies the vanilla blacklist to items created from the creative inventory.
            default: true
          - id: settings.item-dirty-ticks
            key: settings.item-dirty-ticks
            type: integer
            tab: Software Settings
            group: Item Updates
            name: Item Deep-Check Interval
            description: Sets how often item NBT is deeply checked for changes.
            default: 20
            min: 1
          - id: settings.attribute.maxAbsorption.max
            key: settings.attribute.maxAbsorption.max
            type: decimal
            tab: Software Settings
            group: Attribute Limits
            name: Maximum Absorption
            description: Sets the maximum value allowed for the maxAbsorption attribute.
            default: 2048.0
            min: 0.0
          - id: settings.attribute.maxHealth.max
            key: settings.attribute.maxHealth.max
            type: decimal
            tab: Software Settings
            group: Attribute Limits
            name: Maximum Health
            description: Sets the maximum value allowed for the maxHealth attribute.
            default: 1024.0
            min: 0.0
          - id: settings.attribute.movementSpeed.max
            key: settings.attribute.movementSpeed.max
            type: decimal
            tab: Software Settings
            group: Attribute Limits
            name: Maximum Movement Speed
            description: Sets the maximum value allowed for the movementSpeed attribute.
            default: 1024.0
            min: 0.0
          - id: settings.attribute.attackDamage.max
            key: settings.attribute.attackDamage.max
            type: decimal
            tab: Software Settings
            group: Attribute Limits
            name: Maximum Attack Damage
            description: Sets the maximum value allowed for the attackDamage attribute.
            default: 2048.0
            min: 0.0
          - id: settings.netty-threads
            key: settings.netty-threads
            type: integer
            tab: Software Settings
            group: Network
            name: Network Threads
            description: Sets how many Netty threads handle network work.
            default: 4
            min: 1
          - id: settings.player-shuffle
            key: settings.player-shuffle
            type: integer
            tab: Software Settings
            group: Player Processing
            name: Player Shuffle Interval
            description: Shuffles player connection order every this many ticks; zero or less disables shuffling.
            default: 0
            min: -1
          - id: settings.user-cache-size
            key: settings.user-cache-size
            type: integer
            tab: Software Settings
            group: Player Cache
            name: User Cache Size
            description: Sets how many players are kept in usercache.json.
            default: 1000
            min: 0
          - id: settings.moved-too-quickly-multiplier
            key: settings.moved-too-quickly-multiplier
            type: decimal
            tab: Software Settings
            group: Movement Checks
            name: Moved Too Quickly Multiplier
            description: Scales the movement speed a client may send in one packet.
            default: 10.0
            min: 0.0
          - id: settings.moved-wrongly-threshold
            key: settings.moved-wrongly-threshold
            type: decimal
            tab: Software Settings
            group: Movement Checks
            name: Moved Wrongly Threshold
            description: Sets the movement distance squared that causes a client move to be rejected.
            default: 0.0625
            min: 0.0
          - id: advancements.disable-saving
            key: advancements.disable-saving
            type: boolean
            tab: Software Settings
            group: Advancements
            name: Disable Advancement Saving
            description: Prevents player advancements from being saved.
            default: false
          - id: advancements.disabled
            key: advancements.disabled
            type: list
            tab: Software Settings
            group: Advancements
            name: Disabled Advancements
            description: Prevents players from earning the selected advancements or namespaces. Disable All blocks every advancement.
            default: []
            collection:
              mode: sequence
              ordered: true
              unique: true
              value:
                type: text
                catalog: {source: 'server:minecraft:advancement'}
                allowCustom: true
                sentinels:
                  - {value: '*', label: Disable All, role: all}
          - id: messages.whitelist
            key: messages.whitelist
            type: text
            tab: Software Settings
            group: Messages
            name: Whitelist Kick Message
            description: Sets the message shown when a player cannot join the whitelist.
            default: 'You are not whitelisted on this server!'
          - id: messages.unknown-command
            key: messages.unknown-command
            type: text
            tab: Software Settings
            group: Messages
            name: Unknown Command Message
            description: Sets the message shown for an unknown command; Paper no longer uses this key.
            default: 'Unknown command. Type "/help" for help.'
          - id: messages.server-full
            key: messages.server-full
            type: text
            tab: Software Settings
            group: Messages
            name: Server Full Message
            description: Sets the message shown when a player cannot join because the server is full.
            default: 'The server is full!'
          - id: messages.outdated-client
            key: messages.outdated-client
            type: text
            tab: Software Settings
            group: Messages
            name: Outdated Client Message
            description: Sets the message shown to clients older than the server; {0} is replaced with the server version.
            default: 'Outdated client! Please use {}'
          - id: messages.outdated-server
            key: messages.outdated-server
            type: text
            tab: Software Settings
            group: Messages
            name: Outdated Server Message
            description: Sets the message shown when the client is newer; {0} is replaced with the server version.
            default: 'Outdated server! I''m still on {0}'
          - id: messages.restart
            key: messages.restart
            type: text
            tab: Software Settings
            group: Messages
            name: Restart Message
            description: Sets the message shown to players while the server restarts.
            default: Server is restarting
          - id: world-settings.default.below-zero-generation-in-existing-chunks
            key: world-settings.default.below-zero-generation-in-existing-chunks
            type: boolean
            tab: Software Settings
            group: World Generation
            name: Generate Below Zero In Existing Chunks
            description: Generates the post-1.18 lower world section when upgrading existing chunks.
            default: true
          - id: world-settings.default.merge-radius.exp
            key: world-settings.default.merge-radius.exp
            type: decimal
            tab: Software Settings
            group: Item Merging
            name: Experience Merge Radius
            description: Sets the initial block radius for combining experience orbs; zero or less disables it.
            default: 3.0
            min: -1.0
          - id: world-settings.default.merge-radius.item
            key: world-settings.default.merge-radius.item
            type: decimal
            tab: Software Settings
            group: Item Merging
            name: Item Merge Radius
            description: Sets the block radius within which dropped items combine.
            default: 2.5
            min: 0.0
          - id: world-settings.default.ticks-per.hopper-check
            key: world-settings.default.ticks-per.hopper-check
            type: integer
            tab: Software Settings
            group: Hopper Timing
            name: Hopper Check Interval
            description: Sets how many ticks pass between hopper checks for items and inventories.
            default: 1
            min: 0
          - id: world-settings.default.ticks-per.hopper-transfer
            key: world-settings.default.ticks-per.hopper-transfer
            type: integer
            tab: Software Settings
            group: Hopper Timing
            name: Hopper Transfer Interval
            description: Sets how many ticks pass between hopper item transfers.
            default: 8
            min: 1
          - id: world-settings.default.hopper-amount
            key: world-settings.default.hopper-amount
            type: integer
            tab: Software Settings
            group: Hopper Timing
            name: Hopper Transfer Amount
            description: Sets the maximum items moved by a hopper in one transfer.
            default: 1
            min: 1
          - id: world-settings.default.hopper-can-load-chunks
            key: world-settings.default.hopper-can-load-chunks
            type: boolean
            tab: Software Settings
            group: Hopper Timing
            name: Hoppers Load Chunks
            description: Allows hoppers to load chunks while moving items.
            default: false
          - id: world-settings.default.hunger.combat-exhaustion
            key: world-settings.default.hunger.combat-exhaustion
            type: decimal
            tab: Software Settings
            group: Hunger
            name: Combat Exhaustion
            description: Sets the exhaustion added when a player attacks.
            default: 0.1
            min: 0.0
          - id: world-settings.default.hunger.jump-sprint-exhaustion
            key: world-settings.default.hunger.jump-sprint-exhaustion
            type: decimal
            tab: Software Settings
            group: Hunger
            name: Sprint-Jump Exhaustion
            description: Sets the exhaustion added when a player sprints and jumps.
            default: 0.2
            min: 0.0
          - id: world-settings.default.hunger.jump-walk-exhaustion
            key: world-settings.default.hunger.jump-walk-exhaustion
            type: decimal
            tab: Software Settings
            group: Hunger
            name: Walk-Jump Exhaustion
            description: Sets the exhaustion added when a player jumps while walking.
            default: 0.05
            min: 0.0
          - id: world-settings.default.hunger.other-multiplier
            key: world-settings.default.hunger.other-multiplier
            type: decimal
            tab: Software Settings
            group: Hunger
            name: Other Exhaustion Multiplier
            description: Scales exhaustion from normal walking and crouching.
            default: 0.0
            min: 0.0
          - id: world-settings.default.hunger.regen-exhaustion
            key: world-settings.default.hunger.regen-exhaustion
            type: decimal
            tab: Software Settings
            group: Hunger
            name: Regeneration Exhaustion
            description: Sets the exhaustion added while regenerating health.
            default: 6.0
            min: 0.0
          - id: world-settings.default.hunger.sprint-multiplier
            key: world-settings.default.hunger.sprint-multiplier
            type: decimal
            tab: Software Settings
            group: Hunger
            name: Sprint Exhaustion Multiplier
            description: Scales exhaustion from sprinting on the ground.
            default: 0.1
            min: 0.0
          - id: world-settings.default.hunger.swim-multiplier
            key: world-settings.default.hunger.swim-multiplier
            type: decimal
            tab: Software Settings
            group: Hunger
            name: Swimming Exhaustion Multiplier
            description: Scales exhaustion from swimming and moving through water.
            default: 0.01
            min: 0.0
          - id: world-settings.default.enable-zombie-pigmen-portal-spawns
            key: world-settings.default.enable-zombie-pigmen-portal-spawns
            type: boolean
            tab: Software Settings
            group: Mob Spawning
            name: Portal Zombified Piglins
            description: Allows zombified piglins to spawn inside nether portals.
            default: true
          - id: world-settings.default.zombie-aggressive-towards-villager
            key: world-settings.default.zombie-aggressive-towards-villager

            type: list
            tab: Software Settings
            group: Commands
            name: Vanilla Command Replacements
            description: Gives the selected Vanilla commands priority over plugin commands with the same name.
            default: [setblock, summon, testforblock]
            collection:
              mode: sequence
              ordered: true
              unique: true

            type: integer
            tab: Software Settings
            group: Entity Activation
            name: Villager Activation Range
            description: Sets the block range where villagers tick normally; zero or less disables throttling.
            default: 32
            min: -1
          - id: world-settings.default.entity-activation-range.flying-monsters
            key: world-settings.default.entity-activation-range.flying-monsters
            type: integer
            tab: Software Settings
            group: Entity Activation
            name: Flying Monster Activation Range
            description: Sets the block range where flying monsters tick normally; zero or less disables throttling.
            default: 32
            min: -1
          - id: world-settings.default.entity-activation-range.wake-up-inactive.animals-every
            key: world-settings.default.entity-activation-range.wake-up-inactive.animals-every
            type: integer
            tab: Software Settings
            group: Inactive Entity Wake-Up
            name: Animal Wake-Up Interval
            description: Sets how often inactive animals are briefly woken, in ticks.
            default: 1200
            min: 1
          - id: world-settings.default.entity-activation-range.wake-up-inactive.animals-for
            key: world-settings.default.entity-activation-range.wake-up-inactive.animals-for

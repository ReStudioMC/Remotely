  - id: spigot-world-overrides
    name: Dynamic World Overrides
    description: Edit arbitrary named world sections under world-settings.
    priority: 80
    software: [spigot, paper, folia, purpur, leaf]
    documents:
      - path: spigot.yml
        format: yaml
        createIfMissing: true
        fields:
          - id: world-settings.dynamic
            key: world-settings.*
            type: map
            tab: Software Settings
            group: Dynamic World Overrides
            name: Named World Settings
            description: Applies per-world Spigot overrides using the same setting shapes as the default world section.
            default: {}
            collection:
              mode: dynamic-map
              ordered: true
              unique: true
              key:
                type: text
                catalog: {source: 'server:minecraft:world'}
                allowCustom: true
              value: {type: raw}

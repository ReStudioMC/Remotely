            group: Mob Behavior
            name: Zombies Attack Villagers
            description: Makes zombies seek and attack villagers.
            default: true
          - id: world-settings.default.dragon-death-sound-radius
            key: world-settings.default.dragon-death-sound-radius
            type: integer
            tab: Software Settings
            group: Sound Ranges
            name: Dragon Death Sound Radius
            description: Sets how many blocks away the dragon death sound can be heard; zero uses vanilla range.
            default: 0
            min: 0
          - id: world-settings.default.end-portal-sound-radius
            key: world-settings.default.end-portal-sound-radius
            type: integer
            tab: Software Settings
            group: Sound Ranges
            name: End Portal Sound Radius
            description: Sets how many blocks away the end portal opening sound can be heard; zero uses vanilla range.
            default: 0
            min: 0
          - id: world-settings.default.hanging-tick-frequency
            key: world-settings.default.hanging-tick-frequency
            type: integer
            tab: Software Settings
            group: Entity Timing
            name: Hanging Entity Tick Frequency
            description: Sets how often paintings, item frames, and leash knots update, in ticks.
            default: 100
            min: 1
          - id: world-settings.default.wither-spawn-sound-radius
            key: world-settings.default.wither-spawn-sound-radius
            type: integer
            tab: Software Settings
            group: Sound Ranges
            name: Wither Spawn Sound Radius
            description: Sets how many blocks away the wither spawn sound can be heard; zero uses vanilla range.

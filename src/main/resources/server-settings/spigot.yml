            min: 0
          - id: world-settings.default.item-despawn-rate
            key: world-settings.default.item-despawn-rate
            type: integer
            tab: Software Settings
            group: Item Timing
            name: Item Despawn Rate
            description: Sets how many ticks dropped items remain before despawning.
            default: 6000
            min: 0
          - id: world-settings.default.mob-spawn-range
            key: world-settings.default.mob-spawn-range
            type: integer
            tab: Software Settings

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="remotely-build-id" content="__REMOTELY_BUILD_ID__">
    <base id="remotely-base" href="./">
    <script>
        (function () {
            const webCrypto = globalThis.crypto;
            if (!webCrypto || typeof webCrypto.randomUUID === "function" || typeof webCrypto.getRandomValues !== "function") {
                return;
            }
            webCrypto.randomUUID = function () {
                const bytes = new Uint8Array(16);
                webCrypto.getRandomValues(bytes);
                bytes[6] = (bytes[6] & 15) | 64;
                bytes[8] = (bytes[8] & 63) | 128;
                const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
                return hex.slice(0, 8) + "-" + hex.slice(8, 12) + "-" + hex.slice(12, 16) + "-" + hex.slice(16, 20) + "-" + hex.slice(20);
            };
        })();
    </script>
    <script>
        const remotelyPath = window.location.pathname;
        if (remotelyPath === "/remotely-web" || remotelyPath.startsWith("/remotely-web/")) {
            document.getElementById("remotely-base").setAttribute("href", "/remotely-web/");
        }
        if (remotelyPath === "/remotely-web") {
            const canonical = new URL(window.location.href);
            canonical.pathname += "/";
            window.location.replace(canonical.toString());
        }
    </script>
    <title>Remotely</title>
    <link rel="icon" type="image/png" href="assets/remotely/Reemotely.png">
    <link rel="stylesheet" href="assets/restudio/web/rescreen-boot.css">
    <link rel="preload" as="image" href="assets/restudio/textures/icons/__RESCREEN_ICON_ATLAS_IMAGE__">
    <link rel="preload" as="font" type="font/ttf" href="assets/restudio/fonts/web/MinecraftDefault-Regular.ttf" crossorigin>
    <script>window.__RESCREEN_FONT_CACHE__ = "__RESCREEN_FONT_CACHE__";</script>
    <script src="assets/restudio/web/rescreen-web.js"></script>
    <script>
        window.__remotelyUpdate = ReScreenWeb.createUpdateMonitor({
            appTitle: "Remotely",
            buildMeta: 'meta[name="remotely-build-id"]',
            markerUrl: "remotely-web-build-id.txt",
            storageKey: "remotely.update.reload",
            buildQuery: "_remotelyBuild",
            attemptQuery: "_remotelyAttempt",
            nonceQuery: "_remotelyNonce",
            failMessage: "Remotely Web Update Could Not Load",
            fail: message => {
                if (typeof window.__remotelySetStatus === "function") {
                    window.__remotelySetStatus(message);
                }
            }
        });
    </script>
    <style>
        @font-face {
            font-family: "Monocraft";
            src: url("assets/restudio/fonts/web/Monocraft.ttf") format("truetype");
            font-display: block;
        }
        @font-face {
            font-family: "MinecraftDefault";
            src: url("assets/restudio/fonts/web/MinecraftDefault-Regular.ttf") format("truetype");
            font-display: block;
        }
        html,
        body {
            background: #101010;
        }
        #remotely-canvas {
            background: #202020;
        }
    </style>
</head>
<body>
<canvas id="remotely-canvas" class="rescreen-canvas" tabindex="0" aria-label="Remotely"></canvas>
<div id="remotely-status" class="rescreen-boot" role="status" aria-live="polite">
    <div class="rescreen-boot-icon" aria-hidden="true"></div>
    <div class="rescreen-boot-message"></div>
</div>
<script>
    window.__REMOTELY_WEB_CONFIG__ = window.__REMOTELY_WEB_CONFIG__ || {};
    window.__remotelySetStatus = function (message) {
        const status = document.getElementById("remotely-status");
        if (!status) return;
        status.hidden = false;
        status.dataset.failed = "true";
        status.querySelector(".rescreen-boot-message").textContent = String(message || "Remotely Web Could Not Start").slice(0, 240);
        document.title = "Remotely";
    };
</script>
<script>
    const startRemotely = () => {
        const remotelyBundle = document.createElement("script");
        remotelyBundle.id = "remotely-bundle";
        remotelyBundle.src = "js/remotely-browser.js?v=" + encodeURIComponent(window.__remotelyUpdate.localBuildId);
        remotelyBundle.onload = () => {
            window.__remotelyUpdate.preflight().then(shouldStart => {
                if (!shouldStart) return;
                if (typeof window.main !== "function") {
                    window.__remotelySetStatus("Remotely Web Bundle Did Not Load");
                    return;
                }
                try {
                    window.main([]);
                    window.__remotelyUpdate.started();
                    document.getElementById("remotely-status").hidden = true;
                } catch (error) {
                    window.__remotelySetStatus("Remotely Web Could Not Start");
                }
            }, () => window.__remotelySetStatus("Remotely Web Update Could Not Load"));
        };
        remotelyBundle.onerror = () => window.__remotelySetStatus("Remotely Web Bundle Did Not Load");
        document.body.appendChild(remotelyBundle);
    };
    Promise.all([
        window.__remotelyUpdate.preflight(),
        ReScreenWeb.installIconAtlas({manifestName: "__RESCREEN_ICON_ATLAS_MANIFEST__"}).catch(error => {
            console.warn("ReScreen icon atlas unavailable", error);
        })
    ]).then(([shouldStart]) => {
        if (shouldStart) startRemotely();
    }, () => window.__remotelySetStatus("Remotely Web Update Could Not Load"));
</script>
</body>
</html>
